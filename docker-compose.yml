# 后端部署编排（服务器 /opt/alphaclass 下使用）
# 用法：docker compose --env-file .env.staging up -d --pull always backend-staging
# 说明：镜像 tag 由各环境的 <ENV>_TAG 变量控制（deploy.sh 更新），互不影响，支持按环境回滚
services:
  backend-staging:
    image: ghcr.io/jiamingzang/alphaclass-backend:${STAGING_TAG:?缺少 STAGING_TAG}
    container_name: alphaclass-backend-staging
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env.staging

  backend-prod:
    image: ghcr.io/jiamingzang/alphaclass-backend:${PROD_TAG:?缺少 PROD_TAG}
    container_name: alphaclass-backend-prod
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env.prod
