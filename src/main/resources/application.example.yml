# 配置文件模板：复制为 application.yml 并填写真实环境变量后使用。
# 真实 application.yml 已被 .gitignore 忽略，不会提交到仓库。
spring:
  datasource:
    # 库名参数化：staging/prod 共用同一套配置，靠 DB_NAME 选库（alphaclass_staging / alphaclass）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alphaclass}?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&autoReconnect=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    # 迁移开关（默认开）；存量库首次启动自动 baseline 到 V1，新库从 V1 全量执行
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  # 资源对外地址前缀（本地开发默认 localhost，部署时通过 APP_BASE_URL 覆盖）
  base-url: ${APP_BASE_URL:http://localhost:8080/v2}
  # 视频产物经本服务 /proxy 转发后的地址前缀（需与 base-url 同主机）
  video-proxy-prefix: ${VIDEO_PROXY_PREFIX:http://localhost:8080/proxy/}
  # JWT 有效期（小时，默认 5 小时，可通过 JWT_EXPIRE_HOURS 覆盖）
  jwt:
    expire-hours: ${JWT_EXPIRE_HOURS:5}
  cors:
    # 跨域白名单（逗号分隔，默认全部放行；部署时通过 CORS_ALLOWED_ORIGINS 收紧）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 存量密码迁移开关：默认关闭；仅当线上从明文登录切换到哈希登录时，
  # 由运维显式设 PASSWORD_MIGRATION_ENABLED=true 随部署一次性执行（幂等，可重复启动）
  password-migration:
    enabled: ${PASSWORD_MIGRATION_ENABLED:false}
ai:
  baidu:
    client-id: ${BAIDU_CLIENT_ID}
    client-secret: ${BAIDU_CLIENT_SECRET}
  zhipu:
    api-key: ${ZHIPU_API_KEY}
  tencent:
    secret-id: ${TENCENT_SECRET_ID}
    secret-key: ${TENCENT_SECRET_KEY}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:alphaclass}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  youdao:
    app-key: ${YOUDAO_APP_KEY}
    app-secret: ${YOUDAO_APP_SECRET}
springdoc:
  # 接口文档（Swagger UI）开关：生产环境可用 SWAGGER_ENABLED=false 关闭
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    root: INFO
