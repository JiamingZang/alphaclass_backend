# 后端 CI/CD：PR 测试 → push 构建镜像推 GHCR → 部署 v2 测试环境
# 环境形态：v2 = 测试环境（8081，CI 自动部署新版本）；原版（8080 tomcat9）保持不动 = 生产
# 触发范围按路径过滤：只改前端/文档不触发后端流水线
name: Deploy Backend

on:
  push:
    branches: [master]
    # 只忽略文档类改动；代码/配置/脚本任何变化都触发
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '.gitignore'
      - '.gitattributes'
      - 'HELP.md'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阶段 1：测试（PR 与 push 都跑，不回归就放行）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: 全量测试
        run: ./mvnw -B test

  # 阶段 2：构建镜像并推送 GHCR（仅 push；tag = commit SHA 前 8 位）
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha tag 用于精确部署/回滚；latest 用于服务器手动 docker compose up 拉取
          tags: |
            ghcr.io/jiamingzang/alphaclass-backend:sha-${{ github.sha }}
            ghcr.io/jiamingzang/alphaclass-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 输出短 tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  # 阶段 3：部署 v2 测试环境（自动部署，无审批；原版生产不受影响）
  deploy-v2:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 部署 v2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            bash /opt/alphaclass/scripts/deploy.sh ${{ needs.build.outputs.tag }}
