# 生产部署（人工门禁）：仅手动触发，必须显式指定要部署的镜像 tag
# 审批门：job 声明 environment: production，GitHub Settings → Environments 里配置 required reviewers 后，
#         每次触发都会等待人工 Approve 才真正执行 SSH 部署
# 回滚：用旧 tag 重新触发本 workflow 即可（deploy.sh 会把 tag 写回 .env.prod 并重建容器）
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的镜像 tag（如 sha-xxxxxxx，或 latest = 最近一次构建）'
        required: true
        type: string

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 部署生产
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 先同步服务器代码（保证 deploy.sh/compose 与仓库一致），再部署生产
            cd /opt/alphaclass && git pull --ff-only
            bash scripts/deploy.sh ${{ inputs.tag }} prod
